    <div id="gallery-app">
        <h2 class="picture-gallery">Picture Gallery</h2>
        <div class="gallery-container">
            <div v-for="image in images" :key="image.id" class="gallery-item">
                <img :src="image.src" :alt="image.alt" :style="{ width: image.width, height: image.height }" />
            </div>
        </div>
    </div>
    
    <script>
        new Vue({
            el: '#gallery-app',
            data: {
                images: [
                    { id: 1, src: "images/gallery/picture-gallery-1.jpg", alt: "Picture-Gallery-1", width: "300px", height: "400px" },
                    { id: 2, src: "images/gallery/picture-gallery-2.jpg", alt: "Picture-Gallery-2", width: "550px", height: "400px" },
